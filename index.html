<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="IA/360 Avanzado — plataforma personal de formación e investigación sobre inteligencia artificial.">
  <title>IA/360 Avanzado</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131a;color:#f4f2ea;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{text-align:center;max-width:560px;padding:36px}.spinner{width:46px;height:46px;border:4px solid #303746;border-top-color:#9b8cff;border-radius:50%;margin:0 auto 20px;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}p{color:#b7becb}code{background:#1d2230;padding:.1rem .35rem;border-radius:.35rem}
  </style>
</head>
<body>
  <main id="status">
    <div class="spinner" aria-hidden="true"></div>
    <h1>IA/360 Avanzado</h1>
    <p>Cargando la plataforma de estudio…</p>
  </main>
  <script>
    (async()=>{
      if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no permite descomprimir la aplicación. Abrila con una versión actual de Chrome, Edge, Firefox o Safari.');
      const paths=Array.from({length:5},(_,i)=>`chunks/${i}.txt`);
      const pieces=await Promise.all(paths.map(async path=>{
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
        return response.text();
      }));
      const base64=pieces.join('').replace(/\s+/g,'');
      const compressed=Uint8Array.from(atob(base64),char=>char.charCodeAt(0));
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();

      try{
        const configResponse=await fetch('supabase-config.json',{cache:'no-store'});
        if(configResponse.ok){
          const config=await configResponse.json();
          if(config.url&&config.publishableKey){
            const storageKey='ia360-advanced';
            const current=JSON.parse(localStorage.getItem(storageKey)||'{}');
            current.cloud=current.cloud||{};
            current.cloud.config={url:String(config.url).replace(/\/$/,''),key:String(config.publishableKey)};
            localStorage.setItem(storageKey,JSON.stringify(current));
          }
        }
      }catch(error){console.info('IA/360 funciona sin sincronización remota.',error)}

      document.open();
      document.write(html);
      document.close();
    })().catch(error=>{
      document.getElementById('status').innerHTML=`<h1>No se pudo cargar IA/360</h1><p>${String(error.message||error)}</p><p>Recargá la página. Si continúa, verificá que estén publicados los cinco archivos de <code>chunks/</code>.</p>`;
      console.error(error);
    });
  </script>
</body>
</html>
