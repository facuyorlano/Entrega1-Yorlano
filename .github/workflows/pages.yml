name: Publicar IA360 en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio
        run: |
          rm -rf dist
          mkdir dist
          cp index.html supabase-config.json .nojekyll dist/
          if [ -f app.html ]; then
            echo "Usando app.html completo subido al repositorio"
            cp app.html dist/app.html
          else
            echo "app.html todavía no existe; intentando reconstrucción automática"
            python build_pages.py
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
