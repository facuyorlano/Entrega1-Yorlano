name: Publicar IA360 en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir sitio
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import shutil

          source = Path('.')
          dist = Path('dist')
          dist.mkdir(exist_ok=True)

          for name in ('index.html', 'supabase-config.json', '.nojekyll'):
              path = source / name
              if path.exists():
                  shutil.copy2(path, dist / name)

          payload = ''.join(
              (source / 'chunks' / f'{i}.txt').read_text(encoding='utf-8')
              for i in range(5)
          )
          payload = ''.join(payload.split())
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')

          access_gate = r'''<script>
          (() => {
            try {
              const state = JSON.parse(localStorage.getItem('ia360-advanced') || '{}');
              const session = state?.cloud?.session;
              const email = String(session?.user?.email || '').toLowerCase();
              const expired = session?.expires_at && Date.now() >= session.expires_at * 1000;
              if (!session?.access_token || email !== 'efacundoyorlano@gmail.com' || expired) {
                location.replace('./');
              }
            } catch (_) {
              location.replace('./');
            }
          })();
          </script>'''

          if '<head>' not in html:
              raise RuntimeError('El HTML reconstruido no contiene <head>.')
          html = html.replace('<head>', '<head>\n' + access_gate, 1)
          (dist / 'app.html').write_text(html, encoding='utf-8')
          print(f'app.html generado: {len(html):,} caracteres')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
